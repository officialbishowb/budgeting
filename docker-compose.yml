services:
  budgeting:
    build: .
    ports:
      - "3002:3000"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.4
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - budgeting
